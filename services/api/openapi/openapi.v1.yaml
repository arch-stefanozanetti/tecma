openapi: 3.0.1
info:
  title: Followup 3.0 API
  version: 1.0.0
  description: API REST Followup 3.0 (workspaces, progetti, utenti, sessione).
  contact:
    name: Tecma Platform
    email: platform@tecma.example
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaginationInfo:
      type: object
      description: Metadati paginazione standard TECMA
      required:
        - totalDocs
        - page
        - perPage
        - totalPages
        - hasPrevPage
        - hasNextPage
      properties:
        totalDocs:
          type: integer
          minimum: 0
          description: Totale documenti
        page:
          type: integer
          minimum: 1
          description: Pagina corrente (1-based)
        perPage:
          type: integer
          minimum: 1
          description: Elementi per pagina
        totalPages:
          type: integer
          minimum: 0
          description: Numero pagine
        hasPrevPage:
          type: boolean
          description: Indica se esiste una pagina precedente
        hasNextPage:
          type: boolean
          description: Indica se esiste una pagina successiva
        prevPage:
          type: integer
          nullable: true
          description: Pagina precedente
        nextPage:
          type: integer
          nullable: true
          description: Pagina successiva
      additionalProperties: false
      title: PaginationInfo
    ErrorDetail:
      type: object
      description: Dettaglio opzionale di validazione o diagnostica errore
      properties:
        field:
          type: string
          description: Campo che ha generato il dettaglio errore
        value:
          description: Valore ricevuto, quando esponibile in sicurezza
        messageDetail:
          type: array
          description: Dettagli tecnici o di validazione normalizzati
          items:
            type: string
      additionalProperties: false
      title: ErrorDetail
    ErrorEnvelope:
      type: object
      description: Envelope errore standard Followup
      required:
        - code
        - message
        - status
      properties:
        code:
          type: string
          description: Codice errore
        message:
          type: string
          description: Messaggio sicuro per client e log applicativi
        status:
          type: integer
          description: Codice HTTP associato all’errore
        traceId:
          type: string
          description: ID transazione / tracing
        details:
          type: array
          description: Dettagli opzionali dell’errore
          items:
            $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
      title: ErrorEnvelope
    ErrorResponse:
      type: object
      description: Risposta errore standard Followup
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
      additionalProperties: false
      title: ErrorResponse
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      description: Liveness/readiness; pubblico.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                      - appEnv
                    properties:
                      status:
                        type: string
                        example: ok
                      appEnv:
                        type: string
                        example: dev-1
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      operationId: authLogin
      summary: Login con email e password
      tags:
        - Auth
      description: Autentica utente e restituisce access token + profilo. Il refresh token viene impostato via cookie HttpOnly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: Email utente
                password:
                  type: string
                  minLength: 1
                  description: Password
                mfaCode:
                  type: string
                  pattern: ^[0-9]{6}$
                  description: Codice a 6 cifre dell app authenticator, se MFA attiva
              additionalProperties: false
      responses:
        '200':
          description: Access token + profilo (refresh in cookie HttpOnly)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - accessToken
                      - user
                    properties:
                      accessToken:
                        type: string
                        minLength: 20
                      user:
                        type: object
                        additionalProperties: false
                        required:
                          - id
                          - email
                          - systemRole
                          - isTecmaAdmin
                          - permissions
                        properties:
                          id:
                            type: string
                          email:
                            type: string
                            format: email
                          systemRole:
                            type: string
                          isTecmaAdmin:
                            type: boolean
                          permissions:
                            type: array
                            items:
                              type: string
                description: Access token + profilo (refresh in cookie HttpOnly)
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Rinnova access token
      tags:
        - Auth
      description:
        Scambia refresh token per nuova coppia (rotazione). Richiede cookie HttpOnly `followup_refresh_token`
        impostato dal login.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - accessToken
                    properties:
                      accessToken:
                        type: string
                        minLength: 20
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      summary: Richiede reset password
      tags:
        - Auth
      description: Risposta neutra anti-enumerazione; invia email solo se account valido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email utente
      responses:
        '202':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - accepted
                    properties:
                      accepted:
                        type: boolean
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/reset-password:
    post:
      operationId: authResetPassword
      summary: Completa reset password
      tags:
        - Auth
      description: Consuma token monouso hashato e aggiorna password utente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  minLength: 32
                  description: Token reset password
                newPassword:
                  type: string
                  minLength: 12
                  description: Nuova password forte
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - reset
                    properties:
                      reset:
                        type: boolean
        '400':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/invite-accept:
    post:
      operationId: authInviteAccept
      summary: Accetta invito workspace
      tags:
        - Auth
      description: Consuma token invito monouso e imposta password forte.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  minLength: 32
                newPassword:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - accepted
                    properties:
                      accepted:
                        type: boolean
        '400':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/change-password:
    post:
      operationId: authChangePassword
      summary: Cambio password autenticato
      tags:
        - Auth
      description: Aggiorna password e revoca sessioni attive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  description: Password corrente
                newPassword:
                  type: string
                  minLength: 12
                  description: Nuova password forte
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - changed
                    properties:
                      changed:
                        type: boolean
        '400':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/mfa/setup:
    post:
      operationId: authMfaSetup
      summary: Avvia configurazione MFA
      tags:
        - Auth
      description:
        Genera un segreto TOTP temporaneo per configurare un app authenticator. Il segreto va confermato con
        /v1/auth/mfa/verify.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - secret
                      - otpauthUrl
                      - expiresAt
                    properties:
                      secret:
                        type: string
                      otpauthUrl:
                        type: string
                      expiresAt:
                        type: string
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/mfa/verify:
    post:
      operationId: authMfaVerify
      summary: Conferma configurazione MFA
      tags:
        - Auth
      description: Verifica codice TOTP e abilita MFA per utente autenticato.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              additionalProperties: false
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - enabled
                    properties:
                      enabled:
                        type: boolean
        '400':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/mfa:
    delete:
      operationId: authMfaDisable
      summary: Disabilita MFA
      tags:
        - Auth
      description: Disabilita MFA dopo verifica password corrente e codice TOTP. Revoca le sessioni attive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - code
              additionalProperties: false
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - enabled
                    properties:
                      enabled:
                        type: boolean
        '400':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      operationId: authLogout
      summary: Invalida refresh token
      tags:
        - Auth
      description: Revoca sessione refresh lato server. Usa cookie HttpOnly `followup_refresh_token` se presente.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - ok
                    properties:
                      ok:
                        type: boolean
        '400':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      operationId: authMe
      summary: Profilo da JWT
      tags:
        - Auth
      description: Dati minimi utente dal token corrente.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      systemRole:
                        type: string
                      isTecmaAdmin:
                        type: boolean
                      permissions:
                        type: array
                        items:
                          type: string
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sessions:
    get:
      operationId: listAuthSessions
      summary: Elenca sessioni attive del chiamante
      tags:
        - Auth
      description: Ritorna le sessioni con scadenza futura per l utente autenticato. Non espone refreshTokenHash.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - sessionId
                        - createdAt
                        - expiresAt
                      properties:
                        sessionId:
                          type: string
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        rotatedAt:
                          type: string
                        expiresAt:
                          type: string
                        userAgent:
                          type: string
                        ip:
                          type: string
                      additionalProperties: false
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: revokeAllAuthSessions
      summary: Revoca tutte le sessioni del chiamante
      tags:
        - Auth
      description:
        Elimina tutte le sessioni dell utente autenticato. Forza re-login su ogni device. Il client corrente
        ricevera 401 al prossimo refresh.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - ok
                      - revoked
                    properties:
                      ok:
                        type: boolean
                      revoked:
                        type: integer
                        minimum: 0
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeAuthSession
      summary: Revoca singola sessione del chiamante
      tags:
        - Auth
      description:
        Elimina la sessione (sessionId). Le sessioni di altri utenti restituiscono 404 senza distinguere da
        inesistente (anti-enumeration).
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: sessionId
          required: true
          description: Parametro sessionId in path
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - ok
                    properties:
                      ok:
                        type: boolean
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sso-exchange:
    post:
      operationId: authSsoExchange
      summary: Scambio token SSO con JWT interno
      tags:
        - Auth
      description: Valida access token OIDC via JWKS e emette JWT interno.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 10
                  description: Access token OIDC
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - accessToken
                    properties:
                      accessToken:
                        type: string
                        minLength: 20
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users:
    get:
      operationId: listUsers
      summary: Elenco utenti
      tags:
        - Users
      description: Elenco utenti
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
          in: query
          name: page
          required: false
          description: Parametro page in query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: perPage
          required: false
          description: Parametro perPage in query
        - schema:
            type: string
            enum:
              - email
              - createdAt
              - updatedAt
          in: query
          name: sortField
          required: false
          description: Parametro sortField in query
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          in: query
          name: sortOrder
          required: false
          description: Parametro sortOrder in query
        - schema:
            type: string
          in: query
          name: workspaceId
          required: false
          description: Quando presente limita la lista agli utenti membri del workspace indicato.
      security: &a1
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - paginationInfo
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  paginationInfo:
                    $ref: '#/components/schemas/PaginationInfo'
        '401':
          description: Risposta errore standard Followup
          content:
            application/json:
              schema:
