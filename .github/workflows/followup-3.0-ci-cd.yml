# FollowUp 3.0: CI quality gate su main (nessun deploy da Actions).
# Deploy: Render auto-deploy da main (commit) dopo merge PR.
# Gate documentati: business/tecma-digital-platform/followup-3.0/docs/CI_AND_TEST_GATES.md
name: FollowUp 3.0 CI Gate

on:
  push:
    branches: [main]
    paths:
      - "business/tecma-digital-platform/followup-3.0/fe-followup-v3/**"
      - "business/tecma-digital-platform/followup-3.0/be-followup-v3/**"
      - "business/tecma-digital-platform/followup-3.0/docs/**"
      - "business/tecma-digital-platform/design-system/**"
      - "render.yaml"
      - ".github/workflows/followup-3.0-ci-cd.yml"
      - "scripts/render-build-fe.sh"
      - "scripts/render-build-be.sh"
      - "scripts/gh-promote-to-main.sh"
  pull_request:
    branches: [main]
    paths:
      - "business/tecma-digital-platform/followup-3.0/fe-followup-v3/**"
      - "business/tecma-digital-platform/followup-3.0/be-followup-v3/**"
      - "business/tecma-digital-platform/followup-3.0/docs/**"
      - "business/tecma-digital-platform/design-system/**"
      - "render.yaml"
      - ".github/workflows/followup-3.0-ci-cd.yml"
      - "scripts/render-build-fe.sh"
      - "scripts/render-build-be.sh"
      - "scripts/gh-promote-to-main.sh"

concurrency:
  group: followup-3.0-ci-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  FOLLOWUP_FE_DIR: business/tecma-digital-platform/followup-3.0/fe-followup-v3
  FOLLOWUP_BE_DIR: business/tecma-digital-platform/followup-3.0/be-followup-v3

jobs:
  fe-quality-gate:
    name: FE Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node (FE)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: ${{ env.FOLLOWUP_FE_DIR }}/pnpm-lock.yaml

      - name: Install dependencies (FE)
        working-directory: ${{ env.FOLLOWUP_FE_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Run core coverage gate (FE)
        working-directory: ${{ env.FOLLOWUP_FE_DIR }}
        run: pnpm run test:coverage:core

      - name: Run full unit suite (FE)
        working-directory: ${{ env.FOLLOWUP_FE_DIR }}
        run: pnpm run test:run:ci

      - name: Run deploy build (FE)
        run: bash scripts/render-build-fe.sh

  fe-e2e-smoke:
    name: FE E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: fe-quality-gate
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node (FE)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: ${{ env.FOLLOWUP_FE_DIR }}/pnpm-lock.yaml

      - name: Install dependencies (FE)
        working-directory: ${{ env.FOLLOWUP_FE_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: ${{ env.FOLLOWUP_FE_DIR }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke
        working-directory: ${{ env.FOLLOWUP_FE_DIR }}
        env:
          CI: true
          PLAYWRIGHT_USE_WEBSERVER: "true"
        run: pnpm run test:e2e:smoke

  be-quality-gate:
    name: BE Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (BE)
        working-directory: ${{ env.FOLLOWUP_BE_DIR }}
        run: npm ci

      - name: Run tests (BE)
        working-directory: ${{ env.FOLLOWUP_BE_DIR }}
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: followup_ci_test
        run: npm run test

      - name: Run integration tests (BE)
        working-directory: ${{ env.FOLLOWUP_BE_DIR }}
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: followup_ci_integration
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run test:integration

      - name: Run core coverage gate (BE)
        working-directory: ${{ env.FOLLOWUP_BE_DIR }}
        run: npx vitest run -c vitest.core.config.ts --coverage --testTimeout=20000

      - name: Verify core coverage thresholds (BE)
        working-directory: ${{ env.FOLLOWUP_BE_DIR }}
        run: |
          node ./scripts/check-core-coverage.mjs floor
          node ./scripts/check-core-coverage.mjs target

      - name: Run deploy build (BE)
        run: bash scripts/render-build-be.sh
