# Esempio GitLab CI — parità concettuale con `.github/workflows/followup-3.0-security.yml`.
# Non attivo: copia i job nel `.gitlab-ci.yml` del repository o usa `include:` locale.
# Adatta `FOLLOWUP_ROOT` se il clone non usa la stessa gerarchia del monorepo `tecma`.

variables:
  FOLLOWUP_ROOT: "business/tecma-digital-platform/followup-3.0"

stages:
  - security_scan
  - security_aggregate

