name: CI API Greenfield

on:
  push:
    paths:
      - 'services/api/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'scripts/check-no-secrets.sh'
      - '.github/workflows/ci-be.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'scripts/check-no-secrets.sh'
      - '.github/workflows/ci-be.yml'

jobs:
  api-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (tracked files)
        run: bash scripts/check-no-secrets.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @followup/api lint
      - run: pnpm --filter @followup/api typecheck
      - run: pnpm --filter @followup/api build
      - run: pnpm --filter @followup/api test
      - run: pnpm --filter @followup/api test:integration
