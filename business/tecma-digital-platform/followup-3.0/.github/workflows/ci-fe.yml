name: CI Web Greenfield

on:
  push:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'scripts/check-no-secrets.sh'
      - '.github/workflows/ci-fe.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'scripts/check-no-secrets.sh'
      - '.github/workflows/ci-fe.yml'

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (tracked files)
        run: bash scripts/check-no-secrets.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @followup/web lint
      - run: pnpm --filter @followup/web typecheck
      - run: pnpm --filter @followup/web build
      - run: pnpm --filter @followup/web test

  web-e2e:
    runs-on: ubuntu-latest
    needs: web-quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @followup/web exec playwright install --with-deps chromium
      - run: pnpm --filter @followup/web test:e2e
