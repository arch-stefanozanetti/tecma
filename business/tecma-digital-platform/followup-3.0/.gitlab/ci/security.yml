security:semgrep:
  stage: security
  image: returntocorp/semgrep
  needs: []
  before_script: []
  script:
    - semgrep ci --config=.semgrep.yml --config=p/owasp-top-ten --config=p/typescript --json -o semgrep.json
  artifacts:
    when: always
    paths:
      - semgrep.json
    reports:
      sast: semgrep.json
    expire_in: 1 month
  allow_failure: false

security:osv-scanner:
  stage: security
  image: ghcr.io/google/osv-scanner:latest
  needs: []
  before_script: []
  script:
    - /osv-scanner --recursive --skip-git --format=sarif --output=osv.sarif . || true
  artifacts:
    when: always
    paths:
      - osv.sarif
    expire_in: 1 month

security:trivy:fs:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: ['']
  needs: []
  before_script: []
  script:
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format sarif --output trivy.sarif .
  artifacts:
    when: always
    paths:
      - trivy.sarif
    expire_in: 1 month

security:zap:baseline:
  stage: security
  image: ghcr.io/zaproxy/zaproxy:stable
  needs: []
  before_script: []
  script:
    - 'echo "ZAP baseline scan against staging — runs only on schedule"'
    - 'if [ -n "${ZAP_TARGET_URL}" ]; then zap-baseline.py -t "${ZAP_TARGET_URL}" -r zap-report.html || true; fi'
  artifacts:
    when: always
    paths:
      - zap-report.html
    expire_in: 1 month
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
