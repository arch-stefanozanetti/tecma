deploy:prod:
  stage: deploy
  image: alpine/k8s:1.31.0
  needs: ['deploy:demo']
  environment:
    name: production
    url: https://followup.tecmasolutions.com
  before_script:
    - mkdir -p ~/.kube && echo "$KUBECONFIG_PROD" | base64 -d > ~/.kube/config
  script:
    - helm upgrade --install followup-api infra/k8s/charts/api
      --namespace followup-prod
      --create-namespace
      --set image.tag=$CI_COMMIT_SHORT_SHA
      --values infra/k8s/values/prod.yaml
      --wait --timeout=10m
      --atomic
    - helm upgrade --install followup-web infra/k8s/charts/web
      --namespace followup-prod
      --set image.tag=$CI_COMMIT_SHORT_SHA
      --values infra/k8s/values/prod.yaml
      --wait --timeout=10m
      --atomic
  when: manual
  rules:
    - if: $CI_COMMIT_TAG
