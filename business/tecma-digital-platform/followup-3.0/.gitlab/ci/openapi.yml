openapi:lint:
  stage: lint
  needs: ['install:deps']
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm turbo run openapi:generate --filter=@followup/api
    - pnpm exec spectral lint services/api/openapi/openapi.v1.yaml
    - pnpm lint:openapi:domains
  artifacts:
    when: always
    paths:
      - 'services/api/openapi/openapi.v1.yaml'
    expire_in: 1 month

openapi:aws-gateway-compat:
  stage: lint
  needs: ['openapi:lint']
  image: amazon/aws-cli:latest
  before_script: []
  script:
    - 'echo "Validates spec is importable into AWS API Gateway (dry-run)"'
    - 'aws apigateway import-rest-api --body "fileb://services/api/openapi/openapi.v1.yaml" --fail-on-warnings --parameters basepath=ignore || (echo "AWS Gateway compatibility check failed" && exit 1)'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
