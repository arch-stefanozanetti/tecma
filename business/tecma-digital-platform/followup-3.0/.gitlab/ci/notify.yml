# Notifica fine pipeline (opzionale). Impostare CI_MS_TEAMS_WEBHOOK_URL nelle CI/CD variables.
notify:teams:on-success:
  stage: notify
  needs: ['deploy:dev1']
  image: curlimages/curl:8.5.0
  before_script: []
  script:
    - |
      if [ -z "${CI_MS_TEAMS_WEBHOOK_URL}" ]; then
        echo "CI_MS_TEAMS_WEBHOOK_URL non impostato — skip notify"
        exit 0
      fi
      curl -sS -X POST -H 'Content-Type: application/json' \
        -d "{\"text\":\"Pipeline OK: ${CI_PROJECT_NAME} ${CI_COMMIT_REF_NAME} ${CI_PIPELINE_URL}\"}" \
        "${CI_MS_TEAMS_WEBHOOK_URL}" || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  allow_failure: true
