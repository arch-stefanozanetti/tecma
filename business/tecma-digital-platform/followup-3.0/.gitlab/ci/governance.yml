governance:branch-name:
  stage: lint
  needs: []
  script:
    - bash tools/ci/validate-branch-name.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

governance:mr-title:
  stage: lint
  needs: []
  script:
    - bash tools/ci/validate-mr-title.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
