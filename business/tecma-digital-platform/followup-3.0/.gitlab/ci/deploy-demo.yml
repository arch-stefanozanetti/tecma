deploy:demo:
  stage: deploy
  image: alpine/k8s:1.31.0
  needs: ['deploy:dev1']
  environment:
    name: demo
    url: https://followup-demo.tecmasolutions.com
  before_script:
    - mkdir -p ~/.kube && echo "$KUBECONFIG_DEMO" | base64 -d > ~/.kube/config
  script:
    - helm upgrade --install followup-api infra/k8s/charts/api
      --namespace followup-demo
      --create-namespace
      --set image.tag=$CI_COMMIT_SHORT_SHA
      --values infra/k8s/values/demo.yaml
      --wait --timeout=5m
    - helm upgrade --install followup-web infra/k8s/charts/web
      --namespace followup-demo
      --set image.tag=$CI_COMMIT_SHORT_SHA
      --values infra/k8s/values/demo.yaml
      --wait --timeout=5m
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
