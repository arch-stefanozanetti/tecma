lint:eslint:
  stage: lint
  needs: ['install:deps']
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm turbo run lint

lint:typecheck:
  stage: lint
  needs: ['install:deps']
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm turbo run typecheck

lint:format:
  stage: lint
  needs: ['install:deps']
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm format:check

test:unit:
  stage: test
  needs: ['build:packages']
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm turbo run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: '**/coverage/cobertura-coverage.xml'
      junit:
        - '**/junit.xml'

test:integration:
  stage: test
  needs: ['build:packages']
  services:
    - name: mongo:7
      alias: mongo
  variables:
    MONGO_URI: 'mongodb://mongo:27017'
    MONGO_DB_NAME: 'test-zanetti'
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm turbo run test:integration

test:security:db-isolation:
  stage: test
  needs: ['build:packages']
  services:
    - name: mongo:7
      alias: mongo
  variables:
    MONGO_URI: 'mongodb://mongo:27017'
    MONGO_DB_NAME: 'test-zanetti'
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm test:security

test:e2e:
  stage: test
  needs: ['build:web', 'build:api']
  image: mcr.microsoft.com/playwright:v1.50.0-noble
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm turbo run test:e2e
  artifacts:
    when: always
    paths:
      - '**/playwright-report'
    expire_in: 1 week
