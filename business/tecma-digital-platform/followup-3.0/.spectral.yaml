extends:
  - spectral:oas

functionsDir: ./.spectral

rules:
  # === Versioning (servers.url prefix) ===
  tecma-servers-versioning:
    description: 'Almeno un server deve esporre il prefisso /v{n}.'
    message: 'Manca prefisso /v{n} nei servers (URL: {{value}}).'
    given: '$.servers[*].url'
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "/v\\d+/?$"

  # === Path kebab-case ===
  tecma-path-kebab-case:
    description: 'I segmenti di path devono essere kebab-case (escluse path params).'
    message: "Segmento path non kebab-case in '{{property}}'."
    given: '$.paths'
    severity: warn
    then:
      field: '@key'
      function: pattern
      functionOptions:
        match: "^(/[a-z0-9-]+|/\\{[a-zA-Z][a-zA-Z0-9]*\\})+/?$"

  # === Operations ===
  tecma-operationid-camelcase:
    description: 'operationId deve essere camelCase senza acronimi tutti maiuscoli.'
    message: "operationId '{{value}}' non e camelCase."
    given: '$.paths..operationId'
    severity: error
    then:
      function: pattern
      functionOptions:
        match: '^[a-z][a-zA-Z0-9]*$'

  tecma-parameter-camelcase:
    description: 'I parametri path/query devono essere camelCase.'
    message: "Parametro '{{value}}' non e camelCase."
    given: "$.paths..parameters[?(@.in == 'path' || @.in == 'query')].name"
    severity: warn
    then:
      function: pattern
      functionOptions:
        match: '^[a-z][a-zA-Z0-9]*$'

  # === Security ===
  tecma-security-apikey:
    description: 'Lo schema ApiKeyAuth deve essere definito.'
    message: 'Schema ApiKeyAuth mancante in components.securitySchemes.'
    given: '$.components.securitySchemes'
    severity: error
    then:
      field: ApiKeyAuth
      function: truthy

  tecma-security-bearer:
    description: 'Lo schema BearerAuth deve essere definito.'
    message: 'Schema BearerAuth mancante in components.securitySchemes.'
    given: '$.components.securitySchemes'
    severity: error
    then:
      field: BearerAuth
      function: truthy

  # === Schemas & Responses ===
  tecma-error-schema:
    description: 'Deve esistere uno schema ErrorResponse o equivalente (ErrorEnvelope).'
    message: 'Schema ErrorResponse/ErrorEnvelope mancante.'
    given: '$.components.schemas'
    severity: warn
    then:
      function: schema
      functionOptions:
        schema:
          oneOf:
            - required: [ErrorResponse]
            - required: [ErrorEnvelope]
            - required: [APIsError]

  tecma-response-401:
    description: 'Le operazioni protette dovrebbero dichiarare 401.'
    message: "Manca response 401 su '{{path}}'."
    given: '$.paths..[?(@.security)]'
    severity: warn
    then:
      field: responses.401
      function: truthy

  tecma-response-500:
    description: 'Le operazioni dovrebbero dichiarare 500.'
    message: 'Manca response 500.'
    given: '$.paths..[?(@.responses)]'
    severity: warn
    then:
      field: responses.500
      function: truthy

  # === Schema Properties ===
  tecma-schema-property-camelcase:
    description: 'Le property degli schemi devono essere camelCase.'
    message: "Property '{{property}}' non e camelCase."
    given: '$.components.schemas..properties'
    severity: warn
    then:
      field: '@key'
      function: pattern
      functionOptions:
        match: '^[a-z][a-zA-Z0-9]*$'

  tecma-datetime-format:
    description: 'Campi che terminano con On/At/Date devono avere format date-time.'
    message: "Campo '{{property}}' deve avere format date-time."
    given: '$.components.schemas..properties[?(@property.match(/.*(On|At|Date)$/))]'
    severity: warn
    then:
      field: format
      function: pattern
      functionOptions:
        match: '^date-time$'

  tecma-id-field-type:
    description: 'Campi che terminano con Id/id devono essere type string.'
    message: "Campo id '{{property}}' deve essere type string."
    given: '$.components.schemas..properties[?(@property.match(/.*[Ii]d$/))]'
    severity: warn
    then:
      field: type
      function: pattern
      functionOptions:
        match: '^string$'

  # === Documentation ===
  tecma-parameter-description:
    description: 'Ogni parametro deve avere description.'
    message: 'Parametro senza description.'
    given: '$.paths..parameters[*]'
    severity: warn
    then:
      field: description
      function: truthy

  tecma-schema-description:
    description: 'Le property degli schemi dovrebbero avere description.'
    message: 'Property schema senza description.'
    given: '$.components.schemas..properties[*]'
    severity: info
    then:
      field: description
      function: truthy
