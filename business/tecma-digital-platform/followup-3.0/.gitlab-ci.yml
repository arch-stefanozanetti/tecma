stages:
  - install
  - lint
  - test
  - security
  - build
  - deploy
  - notify

variables:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'
  PNPM_STORE_PATH: '$CI_PROJECT_DIR/.pnpm-store'

default:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir "$PNPM_STORE_PATH"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

include:
  - local: .gitlab/ci/governance.yml
  - local: .gitlab/ci/build.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/security.yml
  - local: .gitlab/ci/openapi.yml
  - local: .gitlab/ci/deploy-dev1.yml
  - local: .gitlab/ci/deploy-demo.yml
  - local: .gitlab/ci/deploy-prod.yml
  - local: .gitlab/ci/notify.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
