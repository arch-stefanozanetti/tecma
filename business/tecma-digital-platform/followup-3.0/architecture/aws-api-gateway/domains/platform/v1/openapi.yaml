openapi: 3.0.3
info:
  title: Followup 3.0 — Platform domain
  version: 1.0.0
  description: Workspaces, utenti, progetti, sessione e accessi (allineato ai route handler Fastify).
  contact:
    name: Tecma Platform
    email: platform@tecma.example
servers:
  - url: https://api.example.com
security:
  - ApiKeyAuth: []
  - BearerAuth: []
tags:
  - name: Users
    description: Gestione utenti
  - name: Workspaces
    description: Workspace e membri
  - name: Projects
    description: Progetti e grant
  - name: Session
    description: Preferenze e lookup sessione
paths:
  /v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Elenco utenti
      description: Lista utenti (con paginationInfo).
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Users]
      operationId: inviteUser
      summary: Invita utente
      description: Crea utente invitato.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName]
              properties:
                email: { type: string, format: email }
                fullName: { type: string, minLength: 2 }
                role:
                  type: string
                  enum: [owner, admin, collaborator, viewer]
      responses:
        '201':
          description: Creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
        description: ObjectId utente
        example: 507f1f77bcf86cd799439011
    get:
      tags: [Users]
      operationId: getUserById
      summary: Dettaglio utente
      description: Singolo record utente.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Users]
      operationId: patchUser
      summary: Aggiorna utente
      description: Aggiornamento parziale.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, minLength: 2 }
                systemRole: { type: string, enum: [user, tecma_admin] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Elimina utente
      description: Rimozione record.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/users/{userId}/password-reset:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
        description: ObjectId utente
    post:
      tags: [Users]
      operationId: requestUserPasswordReset
      summary: Richiesta reset password (stub)
      description: Audit evento; nessuna email in questa versione.
      responses:
        '200':
          description: Accettata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: Elenco workspace
      description: Workspace visibili all'utente.
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Crea workspace
      description: Registra un nuovo workspace nel tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2 }
                mfaRequired: { type: boolean }
      responses:
        '201':
          description: Creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/workspaces/{workspaceId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: { type: string }
        description: ID workspace
    get:
      tags: [Workspaces]
      operationId: getWorkspaceById
      summary: Dettaglio workspace
      description: Workspace per ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Workspaces]
      operationId: patchWorkspace
      summary: Aggiorna workspace
      description: Aggiornamento parziale attributi workspace.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                mfaRequired: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Elimina workspace
      description: Rimozione workspace e dati associati (policy applicativa).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/workspaces/{workspaceId}/members:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      summary: Membri workspace
      description: Membership utenti nel workspace.
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Workspaces]
      operationId: addWorkspaceMember
      summary: Aggiungi membro
      description: Aggiunge utente al workspace con ruolo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string }
                role:
                  type: string
                  enum: [owner, admin, collaborator, viewer]
      responses:
        '201':
          description: Creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/workspaces/{workspaceId}/members/{userId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: { type: string }
      - name: userId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Workspaces]
      operationId: patchWorkspaceMember
      summary: Aggiorna ruolo membro
      description: Modifica ruolo membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [owner, admin, collaborator, viewer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Workspaces]
      operationId: removeWorkspaceMember
      summary: Rimuovi membro
      description: Rimuove utente dal workspace.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: Elenco progetti
      description: Filtri opzionali workspaceId e userId.
      parameters:
        - name: workspaceId
          in: query
          schema: { type: string }
          description: Workspace
          example: ws-demo-1
        - name: userId
          in: query
          schema: { type: string }
          description: Utente (ObjectId string)
          example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Crea progetto
      description: Nuovo progetto in un workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, name, code]
              properties:
                workspaceId: { type: string }
                name: { type: string, minLength: 2 }
                code: { type: string, minLength: 2 }
      responses:
        '201':
          description: Creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Projects]
      operationId: getProjectById
      summary: Dettaglio progetto
      description: Progetto per ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Projects]
      operationId: patchProject
      summary: Aggiorna progetto
      description: Aggiornamento parziale progetto.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                code: { type: string, minLength: 2 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Elimina progetto
      description: Rimozione progetto e legami workspace.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/projects/{projectId}/access:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Projects]
      operationId: listProjectAccessGrants
      summary: Lista grant access
      description: Grant di accesso cross-workspace al progetto.
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Projects]
      operationId: createProjectAccessGrant
      summary: Crea grant
      description: Aggiunge grant access per workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, role]
              properties:
                workspaceId: { type: string }
                role:
                  type: string
                  enum: [owner, collaborator, viewer]
      responses:
        '201':
          description: Creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/projects/{projectId}/access/{grantId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - name: grantId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Projects]
      operationId: deleteProjectAccessGrant
      summary: Revoca grant
      description: Rimuove grant per ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/session/projects-by-email:
    post:
      tags: [Session]
      operationId: listSessionProjectsByEmail
      summary: Progetti utente per sessione
      description: Assegnazioni workspace-user-project filtrabili.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                workspaceId: { type: string }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/session/preferences:
    get:
      tags: [Session]
      operationId: getSessionPreferences
      summary: Legge preferenze sessione
      description: Ultimi progetti selezionati (stub se non persistito).
      responses:
        '200':
          description: Preferenze
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Session]
      operationId: setSessionPreferences
      summary: Salva preferenze sessione
      description: Aggiorna elenco progetti preferiti per la sessione.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionPreferencesRequest'
      responses:
        '200':
          description: Preferenze aggiornate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Chiave API interna
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DataEnvelope:
      type: object
      description: Risposta con wrapper data
      properties:
        data:
          type: object
          description: Payload
          additionalProperties: true
    PaginationInfo:
      type: object
      required: [totalDocs, page, perPage, totalPages, hasPrevPage, hasNextPage]
      properties:
        totalDocs: { type: integer, example: 1 }
        page: { type: integer, example: 1 }
        perPage: { type: integer, example: 10 }
        totalPages: { type: integer, example: 1 }
        hasPrevPage: { type: boolean, example: false }
        hasNextPage: { type: boolean, example: false }
        prevPage: { type: integer, nullable: true, example: null }
        nextPage: { type: integer, nullable: true, example: null }
    PaginatedList:
      type: object
      required: [data, paginationInfo]
      properties:
        data:
          type: array
          items: { type: object, additionalProperties: true }
        paginationInfo:
          $ref: '#/components/schemas/PaginationInfo'
    SessionPreferencesRequest:
      type: object
      properties:
        projectIds:
          type: array
          items: { type: string }
          description: ID progetti selezionati
    SessionPreferencesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            projectIds:
              type: array
              items: { type: string }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            status: { type: integer }
  responses:
    BadRequest:
      description: Richiesta non valida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Non autenticato
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Autenticato ma senza permessi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Risorsa assente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Errore server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
