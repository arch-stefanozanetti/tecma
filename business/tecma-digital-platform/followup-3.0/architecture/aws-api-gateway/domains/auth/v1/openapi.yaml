openapi: 3.0.3
info:
  title: Followup 3.0 — Auth domain
  version: 1.0.0
  description: Autenticazione e health pubblici/privati per Followup 3.0.
  contact:
    name: Tecma Platform
    email: platform@tecma.example
servers:
  - url: https://api.example.com
    description: Esempio — sostituire con host reale per ambiente
tags:
  - name: Health
    description: Probe liveness/readiness
  - name: Auth
    description: Login e token
paths:
  /v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Stato servizio
      description: Restituisce stato applicativo; non richiede autenticazione.
      security: []
      responses:
        '200':
          description: Servizio disponibile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data:
                  status: ok
                  appEnv: dev-1
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Login con email e password
      description: Autentica l'utente e restituisce access token e refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: nome.cognome@azienda.it
              password: '********'
      responses:
        '200':
          description: Login riuscito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Rinnova access token
      description: Scambia refresh token per nuova coppia di token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  minLength: 20
                  description: Refresh token opaco
      responses:
        '200':
          description: Token rinnovati
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Logout (revoca refresh)
      description: Invalida il refresh token lato server.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      summary: Profilo corrente da JWT
      description: Dati minimi utente dal bearer token.
      responses:
        '200':
          description: Profilo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string, format: email }
                      systemRole: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/sso-exchange:
    post:
      tags: [Auth]
      operationId: authSsoExchange
      summary: Scambio token SSO
      description: Valida access token OIDC (JWKS) e restituisce JWT interno.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 10 }
      responses:
        '200':
          description: JWT interno
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: SSO non configurato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Chiave interna client/server
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token
  schemas:
    HealthResponse:
      type: object
      description: Wrapper standard con payload health
      properties:
        data:
          type: object
          description: Dati health
          properties:
            status:
              type: string
              description: Stato testuale
              example: ok
            appEnv:
              type: string
              description: Ambiente applicativo
              example: dev-1
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Email utente normalizzata
          example: nome.cognome@azienda.it
        password:
          type: string
          description: Password in chiaro su TLS
          example: Secret123!
    LoginResponse:
      type: object
      properties:
        data:
          type: object
          description: Token e profilo utente
          properties:
            accessToken:
              type: string
              description: JWT access
            refreshToken:
              type: string
              description: Refresh opaco
            user:
              type: object
              properties:
                id:
                  type: string
                  description: Identificativo utente
                email:
                  type: string
                  format: email
                  description: Email
                systemRole:
                  type: string
                  description: Ruolo di sistema
    ErrorResponse:
      type: object
      description: Errore standard TECMA
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Codice errore
            message:
              type: string
              description: Messaggio human-readable
            status:
              type: integer
              description: HTTP status eco
            tId:
              type: string
              description: ID traccia richiesta
  responses:
    BadRequest:
      description: Input non valido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credenziali o API key non valide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: Unauthorized
              message: Missing or invalid x-api-key
              status: 401
    Forbidden:
      description: Permessi insufficienti
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Errore interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
