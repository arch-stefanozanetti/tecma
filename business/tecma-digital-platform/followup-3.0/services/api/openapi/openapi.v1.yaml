                - fullName
              properties:
                email:
                  type: string
                  format: email
                fullName:
                  type: string
                  minLength: 2
                role:
                  type: string
                  enum:
                    - owner
                    - admin
                    - collaborator
                    - viewer
                workspaceId:
                  type: string
                  description: Workspace in cui si invita (richiede ruolo owner/admin).
      security: *a1
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
