openapi: 3.0.1
info:
  title: Followup 3.0 API
  version: 1.0.0
  description: API REST Followup 3.0 (workspaces, progetti, utenti, sessione).
  contact:
    name: Tecma Platform
    email: platform@tecma.example
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    def-0:
      type: object
      description: Metadati paginazione standard TECMA
      required:
        - totalDocs
        - page
        - perPage
        - totalPages
        - hasPrevPage
        - hasNextPage
      properties:
        totalDocs:
          type: integer
          minimum: 0
          description: Totale documenti
        page:
          type: integer
          minimum: 1
          description: Pagina corrente (1-based)
        perPage:
          type: integer
          minimum: 1
          description: Elementi per pagina
        totalPages:
          type: integer
          minimum: 0
          description: Numero pagine
        hasPrevPage:
          type: boolean
        hasNextPage:
          type: boolean
        prevPage:
          type: integer
          nullable: true
          description: Pagina precedente
        nextPage:
          type: integer
          nullable: true
          description: Pagina successiva
      title: PaginationInfo
    def-1:
      type: object
      properties:
        field:
          type: string
        value: {}
        messageDetail:
          type: array
          items:
            type: string
      title: ErrorDetail
    def-2:
      type: object
      required:
        - code
        - message
        - status
      properties:
        code:
          type: string
          description: Codice errore
        message:
          type: string
        status:
          type: integer
        traceId:
          type: string
          description: ID transazione / tracing
        details:
          type: array
          items:
            $ref: '#/components/schemas/def-1'
      title: ErrorEnvelope
    def-3:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/def-2'
      title: ErrorResponse
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      description: Liveness/readiness; pubblico.
      security: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                      - appEnv
                    properties:
                      status:
                        type: string
                        example: ok
                      appEnv:
                        type: string
                        example: dev-1
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/def-3'
  /auth/login:
    post:
      operationId: authLogin
      summary: Login con email e password
      tags:
        - Auth
      description: Autentica utente e restituisce access/refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: Email utente
                password:
                  type: string
                  minLength: 1
                  description: Password
      security: []
      responses:
        '200':
          description: Token e profilo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Token e profilo
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/def-3'
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/def-3'
  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Rinnova access token
      tags:
        - Auth
      description: Scambia refresh token per nuova coppia di token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  minLength: 20
                  description: Refresh token opaco
      security: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/def-3'
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/def-3'
  /auth/logout:
    post:
      operationId: authLogout
      summary: Invalida refresh token
      tags:
        - Auth
      description: Revoca sessione refresh lato server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  minLength: 20
      security: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/def-3'
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/def-3'
  /auth/me:
    get:
      operationId: authMe
      summary: Profilo da JWT
      tags:
        - Auth
      description: Dati minimi utente dal token corrente.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      systemRole:
                        type: string
                      isTecmaAdmin:
                        type: boolean
                      permissions:
                        type: array
                        items:
                          type: string
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/def-3'
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/def-3'
        '500':
          description: Default Response
          content:
            application/json:
              schema:
